Host nspawn
  RemoteForward /home/me/.opener.sock %d/.opener.sock
  RemoteForward 9222 127.0.0.1:9222
  StreamLocalBindUnlink yes
  # OAuth callbacks for MCP logins started on nspawn. The ports are pinned in
  # agents/mcp.json under hosts.ssh, so the Mac browser reaches the listener.
  LocalForward 25121 127.0.0.1:25121
  LocalForward 25122 127.0.0.1:25122
  LocalForward 25123 127.0.0.1:25123
