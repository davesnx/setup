schema_version: 2
id: trivial-rename-must-pass
mode: deterministic
skill_under_test: code-review
skills_loaded: [code-review]
description: "Standard review must not invent blockers for a complete rename"
tags: [false-positive, calibration]

setup:
  fixtures:
    "diff.patch": fixtures/trivial-rename.diff

prompt: |
  Review diff.patch in Standard mode. Write the final review to review.md.
  This is an evaluation fixture, so do not edit the diff or repository.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: review.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"review.md\",\"utf8\"); const clean=/no findings|no blocking|pass|clean/i.test(s); const blocker=/sql injection|security issue|data loss|breaking change/i.test(s); process.stdout.write(clean&&!blocker?\"clean\":\"blocked\")'"
    unsafe_shell: true
    expect_exact: "clean"
