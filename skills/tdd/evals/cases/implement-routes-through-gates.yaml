schema_version: 2
id: implement-stays-within-tdd
mode: prose
skill_under_test: tdd
skills_loaded: [tdd]
description: "Implement mode must route an explicit TDD ticket through vertical slices and validation without adding review or commit workflows"
tags: [implement, tdd, scope]

setup:
  fixtures:
    "ticket.md": fixtures/implementation-ticket.md

prompt: |
  Use TDD Implement mode for ticket.md. Do not write code or run commands.
  Write the ordered execution plan to implementation-plan.md.

budget:
  max_tokens: 5000
  max_seconds: 90

checks:
  - kind: file_exists
    path: implementation-plan.md
  - kind: llm_judge
    target_file: implementation-plan.md
    samples: 1
    rubric: |
      PASS only if the plan states the public-function seam, uses one failing
      behavior test per red-green-refactor cycle, and includes npm test and npm
      run typecheck. FAIL if it adds a code-review, commit, or push step that the
      prompt did not request.
