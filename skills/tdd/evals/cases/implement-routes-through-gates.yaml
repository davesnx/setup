schema_version: 2
id: implement-stays-within-tdd
mode: prose
skill_under_test: tdd
skills_loaded: [tdd]
description: "Implement mode must route an explicit TDD ticket through vertical slices and validation without adding review or commit workflows"
tags: [implement, tdd, scope]

setup:
  fixtures:
    "ticket.md": fixtures/implementation-ticket.md

prompt: |
  Use TDD Implement mode for ticket.md. Do not write code or run commands.
  Write the ordered execution plan to implementation-plan.md.

budget:
  max_tokens: 5000
  max_seconds: 90

checks:
  - kind: file_exists
    path: implementation-plan.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"implementation-plan.md\",\"utf8\"); const required=[/isAdult/,/public.*(function|interface|seam)/i,/RED[\\s\\S]{0,200}(one behavior test|fail)/i,/npm test/,/npm run typecheck/].every(r=>r.test(s)); const bad=/code.review|git commit|git push/i.test(s); process.stdout.write(required&&!bad?\"bounded\":\"invalid\")'"
    unsafe_shell: true
    expect_exact: "bounded"
