schema_version: 2
id: red-green-refactor-order
mode: prose
skill_under_test: tdd
skills_loaded: [tdd]
description: "TDD mode must preserve red-green-refactor ordering and seam discipline"
tags: [tdd, red-green-refactor]

setup:
  fixtures:
    "requirement.md": fixtures/email-requirement.md

prompt: |
  Use TDD Red-green-refactor mode for requirement.md. Do not implement code.
  Write an ordered execution plan to plan.md.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: plan.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"plan.md\",\"utf8\"); const seam=/normalizeEmail|public interface|observable|seam/i.test(s); const ordered=/\\bRED\\b[\\s\\S]*\\bGREEN\\b[\\s\\S]*\\bREFACTOR\\b/i.test(s); const minimal=/minimum|minimal|only enough/i.test(s); process.stdout.write(seam&&ordered&&minimal?\"ordered\":\"invalid\")'"
    unsafe_shell: true
    expect_exact: "ordered"
