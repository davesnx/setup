schema_version: 2
id: technical-docs-routes-developer-docs-only
mode: deterministic
skill_under_test: technical-docs
skills_loaded: [technical-docs, technical-research, x-writing]
description: "Supplied, settled facts route to developer documentation only"
tags: [routing, developer-docs, near-miss]

prompt: |
  Our API team already verified these release facts: SDK v4 requires Node 22,
  replaces start() with run(), and removes Node 18 support. Turn only these
  settled facts into a concise README migration section. Do not do new research
  and do not write social media copy.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: output_contains
    value: '"name":"technical-docs"'
  - kind: output_not_contains
    value: '"name":"technical-research"'
  - kind: output_not_contains
    value: '"name":"x-writing"'
