schema_version: 2
id: research-prefers-primary-source
mode: prose
skill_under_test: technical-writing
skills_loaded: [technical-writing, unslop]
description: "Research mode must prefer primary evidence and report source conflicts"
tags: [research, primary-sources, citations]

setup:
  fixtures:
    "primary-api.md": fixtures/primary-api.md
    "secondary-blog.md": fixtures/secondary-blog.md

prompt: |
  Use Technical writing Research mode to determine the Widget API v2 default
  timeout and API v1 support status from the supplied sources. Write a concise,
  cited result to research.md. Do not use network access.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: research.md
  - kind: llm_judge
    target_file: research.md
    samples: 1
    rubric: |
      PASS only if the report gives 30 seconds as the default, says API v1 is
      supported through December 31 2026, cites primary-api.md, and explicitly
      identifies the conflicting unsupported claims in secondary-blog.md.
