schema_version: 2
id: howto-stays-action-focused
mode: prose
skill_under_test: technical-writing
skills_loaded: [technical-writing]
model: anthropic/claude-sonnet-4-6
description: "How-to mode must turn mixed passive reference prose into a direct task guide"
tags: [technical-writing, how-to, plain-language]

setup:
  fixtures:
    "rough.md": fixtures/rough-howto.md

prompt: |
  Rewrite rough.md as a short how-to for changing the cache timeout. Write the
  result to guide.md. Do not invent a command or value that the source omits.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: guide.md
  - kind: llm_judge
    target_file: guide.md
    samples: 3
    rubric: |
      PASS only if the guide stays on changing the timeout, directly tells the
      reader to edit cache.json and change timeout_ms, removes filler and hype,
      and does not invent a timeout value or executable command. FAIL if it
      adds unrelated enabled-setting guidance.
