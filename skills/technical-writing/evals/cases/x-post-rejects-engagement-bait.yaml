schema_version: 2
id: x-post-rejects-engagement-bait
mode: prose
skill_under_test: technical-writing
skills_loaded: [technical-writing, unslop]
description: "X-post mode must replace engagement bait with specific audience value"
tags: [x-post, anti-bait, current-algorithm]

setup:
  fixtures:
    "draft.txt": fixtures/x-draft.txt

prompt: |
  Use X post mode to rewrite draft.txt for software engineers evaluating AI
  coding tools. Write only the final post to post.md. Do not promise reach or
  invent performance data.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: post.md
  - kind: llm_judge
    target_file: post.md
    samples: 1
    rubric: |
      PASS only if the post removes retweet bait, targets software engineers,
      gives a specific useful framing for evaluating AI coding tools, and does
      not promise reach, virality, or unsupported performance numbers.
