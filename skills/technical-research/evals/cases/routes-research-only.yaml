schema_version: 2
id: technical-research-routes-research-only
mode: deterministic
skill_under_test: technical-research
skills_loaded: [technical-docs, technical-research, x-writing]
description: "Evidence gathering for a later RFC routes to technical research only"
tags: [routing, primary-sources, near-miss]

prompt: |
  Before we write an RFC, investigate whether Node 22 enables WebSocket by
  default. Compare the current Node documentation and source code, note any
  version conflict, and write cited findings to research.md. Do not draft the
  RFC or an X post, and do not edit the project.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: output_contains
    value: '"name":"technical-research"'
  - kind: output_not_contains
    value: '"name":"technical-docs"'
  - kind: output_not_contains
    value: '"name":"x-writing"'
