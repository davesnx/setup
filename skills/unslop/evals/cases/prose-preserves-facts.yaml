schema_version: 2
id: prose-preserves-facts
mode: prose
skill_under_test: unslop
skills_loaded: [unslop]
description: "Prose mode must remove AI tells while preserving concrete facts"
tags: [prose, fact-preservation]

setup:
  fixtures:
    "sloppy.md": fixtures/sloppy-prose.md

prompt: |
  Use Unslop Prose mode on sloppy.md. Write the result to revised.md.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: file_exists
    path: revised.md
  - kind: llm_judge
    target_file: revised.md
    samples: 1
    rubric: |
      PASS only if the revision preserves all three facts (reload every 30
      seconds, YAML and JSON support, invalid-key logging) while removing the
      significance inflation, "at its core", and "not just X" construction,
      and adds no new claim, mechanism, number, source, or opinion.
