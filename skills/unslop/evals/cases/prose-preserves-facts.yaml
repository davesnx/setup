schema_version: 2
id: prose-preserves-facts
mode: deterministic
skill_under_test: unslop
skills_loaded: [unslop]
description: "Prose mode must remove AI tells while preserving concrete facts"
tags: [prose, fact-preservation]

setup:
  fixtures:
    "sloppy.md": fixtures/sloppy-prose.md

prompt: |
  Use Unslop on sloppy.md. Write the result to revised.md.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: file_exists
    path: revised.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"revised.md\",\"utf8\"); const facts=[\"30 seconds\",\"YAML\",\"JSON\",\"invalid keys\"].every(x=>s.includes(x)); const slop=/important to note|groundbreaking|pivotal|At its core|not just|transformative/i.test(s); process.stdout.write(facts&&!slop?\"plain\":\"sloppy\")'"
    unsafe_shell: true
    expect_exact: "plain"
