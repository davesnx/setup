schema_version: 2
id: prose-keeps-neutral-register
mode: prose
skill_under_test: unslop
skills_loaded: [unslop]
description: "Prose mode must improve factual text without adding voice or facts"
tags: [prose, fact-preservation, neutral-register]

setup:
  fixtures:
    "neutral.md": fixtures/neutral-prose.md

prompt: |
  Use Unslop Prose mode on neutral.md. Write the result to revised.md.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: file_exists
    path: revised.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"revised.md\",\"utf8\"); const facts=[/418/,/2008/,/2012/,/county/i,/collector/i,/unknown/i,/2010/].every(r=>r.test(s)); const bad=/important to note|\\bI\\b|\\bwe\\b|in my opinion|https?:/i.test(s); process.stdout.write(facts&&!bad?\"neutral\":\"invalid\")'"
    unsafe_shell: true
    expect_exact: "neutral"
