schema_version: 2
id: code-preserves-behavior
mode: prose
skill_under_test: unslop
skills_loaded: [unslop]
description: "Code mode must remove defensive AI slop without changing behavior"
tags: [code, behavior-preservation, cleanup]

setup:
  fixtures:
    "sloppy.mjs": fixtures/sloppy.mjs

prompt: |
  Use Unslop Code mode on sloppy.mjs. The function's trusted contract is
  number[]. Remove AI-generated slop and preserve its observable behavior.
  Edit sloppy.mjs and write a concise summary to cleanup.md.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: cleanup.md
  - kind: shell
    cmd: "node -e 'import(\"./sloppy.mjs\").then(m => console.log([m.firstPositive([-2, 0, 3, 4]), m.firstPositive([-2, 0])].join(\",\")))'"
    unsafe_shell: true
    expect_exact: "3,"
  - kind: llm_judge
    target_file: sloppy.mjs
    samples: 1
    rubric: |
      PASS only if the code removes the redundant comment, abnormal try/catch,
      Array.isArray check, typeof check, and deep nesting while preserving the
      first-positive-or-undefined behavior for number arrays.
