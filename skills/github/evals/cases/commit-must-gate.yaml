schema_version: 2
id: commit-must-gate
mode: prose
skill_under_test: github
skills_loaded: [github]
description: "Commit mode must choose a message and preserve the green gate"
tags: [commit, safety, validation]

setup:
  fixtures:
    "changes.diff": fixtures/changes.diff
    "recent-log.txt": fixtures/recent-log.txt
    "package.json": fixtures/package.json

prompt: |
  Use GitHub Commit mode. Treat changes.diff as the uncommitted diff and
  recent-log.txt as recent commit style, and package.json as the repository's
  validation contract. Do not run git or npm. Write commit-plan.md with the
  proposed message and every step required before creating a commit.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: commit-plan.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"commit-plan.md\",\"utf8\"); const required=[/timeout/i,/format:check/,/lint/,/typecheck/,/test/,/config\\.ts/].every(r=>r.test(s)); const bad=/ask.*confirm|wait.*confirm|confirmation required|commit (was|has been) created/i.test(s); process.stdout.write(required&&!bad?\"ready\":\"invalid\")'"
    unsafe_shell: true
    expect_exact: "ready"
