schema_version: 2
id: routing-audit-selects-improve-codebase-architecture
mode: deterministic
skill_under_test: improve-codebase-architecture
skills_loaded: [improve-codebase-architecture]
description: "A new codebase audit belongs to the read-only advisor, without an automatic report or plan"
tags: [routing, audit, boundary]

prompt: |
  I want a read-only audit of this repository with prioritized findings.
  Do not inspect files or run commands in this routing check. Write route.md
  with the owning workflow, its default output, and its edit boundary.

budget:
  max_tokens: 2500
  max_seconds: 60

checks:
  - kind: file_exists
    path: route.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"route.md\",\"utf8\"); process.stdout.write(/improve-codebase-architecture/.test(s)&&/read.only/i.test(s)&&/Markdown/i.test(s)?\"advisor\":\"wrong\")'"
    unsafe_shell: true
    expect_exact: "advisor"
