schema_version: 2
id: domain-modeling-writes-glossary
mode: prose
skill_under_test: domain-modeling
skills_loaded: [domain-modeling]
description: "Domain-modeling mode must create a precise glossary without an ADR"
tags: [domain-modeling, glossary, adr-calibration]

setup:
  fixtures:
    "brief.md": fixtures/cancellation-brief.md

prompt: |
  Use Domain Modeling for brief.md. Write the resolved domain model to
  CONTEXT.md. Do not create an ADR because the brief does not meet the ADR bar.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: CONTEXT.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"CONTEXT.md\",\"utf8\"); const required=/cancell?ation/i.test(s)&&/shipped/i.test(s)&&(/cancell?ation[\\s\\S]{0,100}reason/i.test(s)||/reason[\\s\\S]{0,100}cancell?ation/i.test(s)); const bad=/architecture decision record|^# ADR/im.test(s); process.stdout.write(required&&!bad?\"modeled\":\"invalid\")'"
    unsafe_shell: true
    expect_exact: "modeled"
