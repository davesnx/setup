schema_version: 2
id: prose-matches-supplied-voice
mode: prose
skill_under_test: unslop
skills_loaded: [unslop]
description: "Explicit voice and punctuation requirements override generic editing preferences"
tags: [prose, voice-preservation]

setup:
  fixtures:
    "voice.md": fixtures/voice-sample.md

prompt: |
  Use voice.md as my writing sample. Keep my first-person viewpoint and use
  an em dash to connect these thoughts. Write only the result to revised.md:
  "My second deploy worked. I still have not tested my rollback plan."

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: file_exists
    path: revised.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"revised.md\",\"utf8\").replace(/\\s+/g,\" \"); const facts=/second deploy/i.test(s)&&/work/i.test(s)&&/rollback/i.test(s)&&/not (?:yet )?tested|haven.t tested|still need to test|untested/i.test(s); const voice=/\\b(?:I|my)\\b/i.test(s)&&s.includes(\"—\"); const invented=/\\d{1,2}:\\d{2}|annoy|failed/i.test(s); process.stdout.write(facts&&voice&&!invented?\"matched\":\"invalid\")'"
    unsafe_shell: true
    expect_exact: "matched"
