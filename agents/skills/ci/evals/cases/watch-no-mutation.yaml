schema_version: 2
id: watch-no-mutation
mode: prose
skill_under_test: ci
skills_loaded: [ci]
description: "Watch uses bounded observation of the current target without fix, retry, or push authority"
tags: [ci, watch, authorization, target]

prompt: |
  Use the ci skill to watch PR 42 for up to two minutes. The following saved
  observations are the complete input; do not run commands or contact CI.
  Initially the head is abc123: GitHub unit checks passed, Buildkite build
  87 is running. At 60 seconds, abc123 is unchanged and build 87 failed.
  At 90 seconds, another actor pushed def456 and build 88 passed.
  In a second independent scenario, abc123 and build 87 remain running
  through 120 seconds. Decide how each watch ends. No push permission has
  been granted.
  Write watch.json with exactly:
  mode: inspect, watch, fix, or retry;
  target: the commit; build: number; limit_seconds: number;
  actions: array drawn from inspect, observe, edit, retry, commit, push;
  requires_push_authorization: boolean;
  failure: {stop_seconds, state, follow_new_head, green};
  timeout: {stop_seconds, state, green}.
  Use state failed, pending, or passed for the observed checks.

budget:
  max_tokens: 4000
  max_seconds: 90

checks:
  - kind: file_exists
    path: watch.json
  - kind: shell
    cmd: |
      node <<'JS'
      const fs = require('fs');
      const assert = require('node:assert/strict');
      const watch = JSON.parse(fs.readFileSync('watch.json', 'utf8'));
      assert.ok(Array.isArray(watch.actions));
      assert.ok(watch.actions.includes('observe'));
      assert.ok(watch.actions.every(action => ['inspect', 'observe'].includes(action)));
      assert.deepEqual(watch, {
        mode: 'watch', target: 'abc123', build: 87, limit_seconds: 120,
        actions: watch.actions,
        requires_push_authorization: false,
        failure: {stop_seconds: 60, state: 'failed', follow_new_head: false, green: false},
        timeout: {stop_seconds: 120, state: 'pending', green: false},
      });
      process.stdout.write('observed');
      JS
    unsafe_shell: true
    expect_exact: "observed"
