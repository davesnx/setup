schema_version: 2
id: answered-round-keeps-unresolved-fact-partial
mode: prose
skill_under_test: post-draft
skills_loaded: [post-draft]
description: "Write a confirmed answer without forcing a shape or completing an unsupported result"
tags: [prose, partial-draft, voice-preservation, evidence]

setup:
  fixtures:
    VOICE.md: fixtures/VOICE.md
    src/content/posts/cache-notebook.md: fixtures/partial-cache.md
    source-notes.md: fixtures/source-notes.md

prompt: |
  Continue src/content/posts/cache-notebook.md with post-draft and the local
  VOICE.md. The previous interview round asked why I kept the cache. My
  confirmed answer is: I kept it because offline preview lets me read pages
  on the train. That is a convenience choice, not a measured speed result.

  The other gap is still blocked: bench-results.txt was never captured and
  I cannot provide a cold-start measurement now. Read source-notes.md for
  the same answer and an external result that is not mine; keep it unchanged.
  This sandbox contains all available evidence; do not use the web or another
  repository. Continue from this answered round. Keep the headings and
  maintenance note intact. Record one answered interview round.
  Put a brief account of what you did in progress.md. For this test only,
  progress.md itself must contain one JSON object, without code fences or extra
  prose, with exactly these fields: evidence_source
  (the source file path), answered_interview_rounds (a number), status
  (the draft's SKILLS state), added_passages (an array), and cold_start_claims
  (an array).
  Each added_passages record must have exactly text and source_quotes. text is
  one newly added prose paragraph, as a nonempty string. source_quotes is a
  nonempty array of exact supporting source sentences from source-notes.md;
  replace source line breaks with spaces. Use whole sentences, not fragments.
  For this bounded test, use plain prose paragraphs. Parse them as follows:
  normalize CRLF to LF; remove <!-- SKILLS ... --> comments and [Q:...] spans;
  replace each heading line (one to six # characters followed by a space at
  the start of a line) with a blank line; split on blank lines containing only
  spaces or tabs; collapse each block's whitespace to one space and trim it.
  Discard empty blocks and the exact unchanged maintenance-note paragraph.
  The original fixture has no other prose, so every remaining block is new.
  Supply exactly one record per block. Record order does not matter. No missing,
  duplicate, or unwritten records are allowed; do not repeat prose paragraphs.
  text is compared after the same whitespace normalization. Do not record
  headings, SKILLS comments, question placeholders, or the maintenance note.
  For each cold-start statement added to the prose, include a claim record:
  text (the exact written passage), subject ("author" or "external-report"),
  status ("measured" or "unavailable"), milliseconds (a number for a measured
  result, otherwise null), and source_quote (an exact supporting sentence
  from source-notes.md, with line breaks replaced by spaces). A denial that
  the external result belongs to me records my result as unavailable, not
  as a measurement. Use an empty array if no cold-start statements are added.
  The checker validates paragraph coverage, source integrity, exact citations,
  and cold-start records against written spans. Manual review must still check
  that each quote supports the passage, that attribution and interpretation
  are correct, and that cold_start_claims covers and classifies every cold-start
  statement truthfully. A real quote attached to nonsense can pass these checks;
  citation matching does not prove semantic correctness.

budget:
  max_tokens: 4500
  max_seconds: 120

checks:
  - kind: shell
    cmd: |
      node -e '
      const fs = require("node:fs");
      const assert = require("node:assert/strict");
      const s = fs.readFileSync("src/content/posts/cache-notebook.md", "utf8").replace(/\r\n/g, "\n");
      const opening = s.split(/^# Why keep the cache\?\s*$/m)[1]?.split(/^## /m)[0] || "";
      assert.match(opening, /\bI\b/);
      assert.match(opening, /offline/i);
      assert.match(opening, /train/i);
      assert.doesNotMatch(opening, /\[Q:/);
      const skills = s.match(/<!--\s*SKILLS\b([\s\S]*?)-->/)?.[1] || "";
      assert.match(skills, /^state:\s*partial\s*$/m);
      assert.match(skills, /^next:.*(?:bench|cold.start|measur|evidence)/im);
      assert.match(s, /\[Q:[^\]]*(?:cold.start|bench-results|measur)[^\]]*\]/i);
      assert.deepEqual(s.match(/^#{1,6} .+$/gm), ["# Why keep the cache?", "## What is still unknown?", "## Maintenance note"]);
      const maintenance = "The backup key is in the blue drawer. This note does not concern cache performance.";
      assert.equal(s.split("## Maintenance note")[1]?.trim(), maintenance);
      const { added_passages, cold_start_claims, ...progress } = JSON.parse(fs.readFileSync("progress.md", "utf8"));
      assert.deepEqual(progress, {
        evidence_source: "source-notes.md", answered_interview_rounds: 1, status: "partial"
      });
      const source = fs.readFileSync("source-notes.md", "utf8");
      assert.equal(source, "# Author notes\n\nI kept the cache because offline preview lets me read pages on the train.\nThis is a convenience choice, not a measured speed result.\n\nAn external report says its author measured a 12 ms cold start. That is their\nresult, not mine. My bench-results.txt was never captured.\n");
      const sourceSentences = [
        "I kept the cache because offline preview lets me read pages on the train.",
        "This is a convenience choice, not a measured speed result.",
        "An external report says its author measured a 12 ms cold start.",
        "That is their result, not mine.",
        "My bench-results.txt was never captured."
      ];
      const normalize = text => text.replace(/\s+/g, " ").trim();
      assert.equal(normalize(source.replace(/^# Author notes\n/, "")), sourceSentences.join(" "));
      const prose = s.replace(/<!--\s*SKILLS\b[\s\S]*?-->/g, "").replace(/\[Q:[^\]]*\]/g, "");
      const paragraphs = prose.replace(/^#{1,6} [^\n]*$/gm, "\n")
        .split(/\n[ \t]*\n/).map(normalize).filter(text => text && text !== maintenance);
      assert.ok(Array.isArray(added_passages));
      for (const passage of added_passages) {
        assert.ok(passage && typeof passage === "object" && !Array.isArray(passage));
        assert.deepEqual(Object.keys(passage).sort(), ["source_quotes", "text"]);
        assert.ok(typeof passage.text === "string" && passage.text.trim());
        assert.ok(Array.isArray(passage.source_quotes) && passage.source_quotes.length > 0);
        assert.ok(passage.source_quotes.every(quote => typeof quote === "string" && quote.trim() && sourceSentences.includes(quote)));
      }
      const recorded = added_passages.map(passage => normalize(passage.text));
      assert.equal(new Set(recorded).size, recorded.length);
      assert.deepEqual(recorded.sort(), paragraphs.sort());
      assert.ok(Array.isArray(cold_start_claims));
      for (const claim of cold_start_claims) {
        const { text, ...evidence } = claim;
        assert.ok(typeof text === "string" && text.trim() && prose.includes(text));
        assert.ok(["author", "external-report"].includes(evidence.subject));
        const expected = evidence.subject === "author"
          ? { subject: "author", status: "unavailable", milliseconds: null, source_quote: "My bench-results.txt was never captured." }
          : { subject: "external-report", status: "measured", milliseconds: 12, source_quote: "An external report says its author measured a 12 ms cold start." };
        assert.ok(sourceSentences.includes(expected.source_quote));
        assert.deepEqual(evidence, expected);
      }
      process.stdout.write("source-supported-partial");'
    unsafe_shell: true
    expect_exact: source-supported-partial
