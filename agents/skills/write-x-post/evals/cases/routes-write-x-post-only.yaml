schema_version: 2
id: write-x-post-routes-write-x-post-only
mode: deterministic
skill_under_test: write-x-post
skills_loaded: [technical-docs, write-x-post]
description: "A technical release announcement for X routes to X writing only"
tags: [routing, x-post, near-miss]

prompt: |
  Rewrite this verified release note as one X post for TypeScript developers:
  "On Node 22 in our Linux CI benchmark, SDK v4 cuts cold start time from 240
  ms to 130 ms." Keep the benchmark conditions explicit and avoid reach claims.
  Do not turn it into README text or start new research.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: output_contains
    value: '"name":"write-x-post"'
  - kind: output_not_contains
    value: '"name":"technical-docs"'
