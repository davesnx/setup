schema_version: 2
id: sql-injection-must-block
mode: deterministic
skill_under_test: code-review
skills_loaded: [code-review]
description: "Standard review must catch a reachable SQL injection regression"
tags: [security, correctness, standard-review]

setup:
  fixtures:
    "diff.patch": fixtures/sql-injection.diff

prompt: |
  Review diff.patch in Standard mode. Write the final review to review.md.
  This is an evaluation fixture, so do not edit the diff or repository.

budget:
  max_tokens: 5000
  max_seconds: 90

checks:
  - kind: file_exists
    path: review.md
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"review.md\",\"utf8\"); const injection=/sql injection|injection payload|interpolated directly into sql/i.test(s); const severe=/high|critical/i.test(s); const fix=/parameteri[sz]ed|placeholder|bound parameter/i.test(s); process.stdout.write(injection&&severe&&fix?\"blocked\":\"missed\")'"
    unsafe_shell: true
    expect_exact: "blocked"
