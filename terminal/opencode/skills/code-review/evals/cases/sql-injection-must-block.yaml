schema_version: 2
id: sql-injection-must-block
mode: deterministic
skill_under_test: code-review
skills_loaded: [code-review]
description: "Standard review must report a blocking SQL finding with source evidence"
tags: [security, correctness, standard-review]

setup:
  fixtures:
    "diff.patch": fixtures/sql-injection.diff
    "users.py": fixtures/users.py

prompt: |
  Review diff.patch in Standard mode. Write the final review to review.md.
  users.py is the complete changed source. This is an evaluation fixture,
  so do not edit the diff or source. Write only review.md in the workspace.

  Test protocol: review.md must contain one JSON object, without code fences
  or extra prose. Use exactly these fields:
  - action: "approve" or "block"
  - findings: an array of objects with exactly these fields:
    file (path), line (new-file line number), severity ("low", "medium",
    "high", or "critical"), category ("sql-injection", "other-security",
    or "correctness"), remediation ("bound-parameters", "input-validation",
    or "other"), evidence (an object with source and sink strings copied
    from the relevant new-file lines, without diff prefixes or indentation).
  An empty findings array represents no findings. This structured review
  keeps decisions, locations, and evidence readable. The test grades this
  contract, not the meaning of unrestricted review prose.

budget:
  max_tokens: 5000
  max_seconds: 90

checks:
  - kind: file_exists
    path: review.md
  - kind: shell
    cmd: |
      node <<'JS'
      const assert = require('node:assert/strict');
      const fs = require('node:fs');
      const { createHash } = require('node:crypto');
      for (const [path, hash] of Object.entries({
        'diff.patch': '66439f9bbff1507e292716fd25da1ad1aa193de00e2bab4124f50011c2baefb8',
        'users.py': '5db0261fa98eb56429daa13561bbc70c5eb7facd1000851cca7dad55236edee7',
      })) assert.equal(createHash('sha256').update(fs.readFileSync(path)).digest('hex'), hash, path);
      const review = JSON.parse(fs.readFileSync('review.md', 'utf8'));
      assert.deepEqual(Object.keys(review).sort(), ['action', 'findings']);
      assert.equal(review.action, 'block');
      assert.ok(Array.isArray(review.findings));
      assert.equal(review.findings.length, 1);
      const finding = review.findings[0];
      assert.deepEqual(Object.keys(finding).sort(), ['category', 'evidence', 'file', 'line', 'remediation', 'severity']);
      assert.equal(finding.file, 'users.py');
      assert.ok([10, 11].includes(finding.line));
      assert.ok(['high', 'critical'].includes(finding.severity));
      assert.equal(finding.category, 'sql-injection');
      assert.equal(finding.remediation, 'bound-parameters');
      assert.deepEqual(finding.evidence, {
        source: `query = f"SELECT id, name FROM users WHERE name = '{name}'"`,
        sink: 'return connection.execute(query).fetchone()',
      });
      // Exact evidence is tied to this fixture, not a claim to understand prose.
      const diff = fs.readFileSync('diff.patch', 'utf8');
      for (const line of Object.values(finding.evidence)) assert.ok(diff.includes('+    ' + line + '\n'));
      process.stdout.write('blocked');
      JS
    unsafe_shell: true
    expect_exact: "blocked"
