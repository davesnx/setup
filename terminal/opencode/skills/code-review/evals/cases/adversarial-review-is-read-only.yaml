schema_version: 2
id: adversarial-review-is-read-only
mode: deterministic
skill_under_test: code-review
skills_loaded: [code-review]
description: "Adversarial review synthesizes independent evidence and lead judgment without editing its target"
tags: [adversarial, multi-model, synthesis, read-only]

setup:
  fixtures:
    "diff.patch": fixtures/sql-injection.diff
    "expected.patch": fixtures/sql-injection.diff
    "users.py": fixtures/users.py

prompt: |
  Interrogate diff.patch with Code Review's Adversarial / Multi-model mode.
  users.py is the complete changed source. Write the final review to review.md.
  Do not edit diff.patch, expected.patch, or users.py. Write only review.md in
  the workspace.

  Test protocol: write one JSON object without fences. Use fields intent,
  reviewers (array of {id, lens, evidence, model}; model may be null),
  limitation (string; explain if independent jobs or model selection are
  unavailable), agreement (array of {claim, reviewers, resolution}), and
  findings (array of {file, line, severity, decision, evidence, remedy}).
  Decisions are act-on, consider, or dismissed. Evidence must cite the changed
  source. Include only real reviewers and supported findings; empty arrays
  are valid. This protocol tests evidence, not Markdown heading choices.

budget:
  max_tokens: 6000
  max_seconds: 120

checks:
  - kind: file_exists
    path: review.md
  - kind: shell
    cmd: "cmp -s diff.patch expected.patch && printf unchanged"
    unsafe_shell: true
    expect_exact: "unchanged"
  - kind: shell
    cmd: |
      node <<'JS'
      const assert = require('node:assert/strict');
      const fs = require('node:fs');
      const { createHash } = require('node:crypto');
      for (const [path, hash] of Object.entries({
        'diff.patch': '66439f9bbff1507e292716fd25da1ad1aa193de00e2bab4124f50011c2baefb8',
        'expected.patch': '66439f9bbff1507e292716fd25da1ad1aa193de00e2bab4124f50011c2baefb8',
        'users.py': '5db0261fa98eb56429daa13561bbc70c5eb7facd1000851cca7dad55236edee7',
      })) assert.equal(createHash('sha256').update(fs.readFileSync(path)).digest('hex'), hash, path);
      const r = JSON.parse(fs.readFileSync('review.md', 'utf8'));
      const text = value => typeof value === 'string' && value.trim().length > 0;
      assert.ok(text(r.intent));
      assert.ok(Array.isArray(r.reviewers));
      assert.equal(typeof r.limitation, 'string');
      const ids = r.reviewers.map(reviewer => reviewer.id);
      assert.equal(new Set(ids).size, ids.length);
      for (const reviewer of r.reviewers) {
        assert.ok([reviewer.id, reviewer.lens, reviewer.evidence].every(text));
        assert.ok(reviewer.model === null || text(reviewer.model));
      }
      if (ids.length < 2 || r.reviewers.some(reviewer => reviewer.model === null)) {
        assert.ok(text(r.limitation));
      }
      assert.ok(Array.isArray(r.agreement));
      if (ids.length >= 2) assert.ok(r.agreement.length > 0);
      for (const entry of r.agreement) {
        assert.ok(text(entry.claim) && text(entry.resolution));
        assert.ok(Array.isArray(entry.reviewers) && entry.reviewers.length > 0);
        assert.ok(entry.reviewers.every(id => ids.includes(id)));
      }
      assert.ok(Array.isArray(r.findings));
      for (const finding of r.findings) {
        assert.ok(['act-on', 'consider', 'dismissed'].includes(finding.decision));
        assert.ok(text(finding.evidence) && text(finding.remedy));
      }
      assert.ok(r.findings.some(f => f.file === 'users.py' && [10, 11].includes(f.line)
        && text(f.severity) && ['high', 'critical'].includes(f.severity.toLowerCase()) && f.decision === 'act-on'
        && /param|bind|bound/i.test(f.remedy)));
      process.stdout.write('complete');
      JS
    unsafe_shell: true
    expect_exact: "complete"
