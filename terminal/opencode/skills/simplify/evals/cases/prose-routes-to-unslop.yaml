schema_version: 2
id: simplify-prose-routes-to-unslop
mode: deterministic
skill_under_test: simplify
skills_loaded: [simplify, unslop]
description: "With both skills available, prose cleanup routes only to Unslop"
tags: [routing, prose, skill-overlap]

setup:
  fixtures:
    "sloppy.md": fixtures/sloppy-prose.md
    "app.mjs": fixtures/sloppy.mjs
    "expected.mjs": fixtures/sloppy.mjs

prompt: |
  Clean up the AI-generated prose in sloppy.md and write the result to
  revised.md. Do not edit source code.

budget:
  max_tokens: 3000
  max_seconds: 90

checks:
  - kind: file_exists
    path: revised.md
  - kind: output_contains
    value: '"name":"unslop"'
  - kind: output_not_contains
    value: '"name":"simplify"'
  - kind: shell
    cmd: "cmp -s app.mjs expected.mjs && printf unchanged"
    unsafe_shell: true
    expect_exact: "unchanged"
  - kind: shell
    cmd: "node -e 'const s=require(\"fs\").readFileSync(\"revised.md\",\"utf8\"); const facts=[\"30 seconds\",\"YAML\",\"JSON\",\"invalid keys\"].every(x=>s.includes(x)); const slop=/important to note|groundbreaking|pivotal|At its core|not just|transformative/i.test(s); process.stdout.write(facts&&!slop?\"plain\":\"sloppy\")'"
    unsafe_shell: true
    expect_exact: "plain"
