[project]
name = "setup-skill-evals"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["coder-eval==0.12.1"]

[dependency-groups]
dev = ["ruff==0.15.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
